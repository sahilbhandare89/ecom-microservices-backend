spring:
  data:
    mongodb:
      uri: mongodb://root:root@localhost:27018/product_db?authSource=admin

  elasticsearch:
    uris: http://localhost:9200

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null


  logging:
    level:
      org.mongodb.driver: TRACE
      org.springframework.data.mongodb: DEBUG

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: product-images

server:
  port: 8081

logging:
  level:
    com.ecommerce_microservices.product_service: DEBUG
    io.minio: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
